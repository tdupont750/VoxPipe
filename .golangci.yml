# golangci-lint v2 configuration. Run with `make lint`, which builds libwhisper first so the
# cgo packages typecheck.
version: "2"

linters:
  # The standard set is errcheck, govet, ineffassign, staticcheck and unused.
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - misspell
    - nilerr
    - noctx
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  exclusions:
    presets:
      - std-error-handling
    paths:
      - third_party
    rules:
      # Test helpers write to in-memory pipes and recorders; a failed write already fails the
      # assertion that follows, so checking every one adds noise rather than safety.
      - path: _test\.go
        linters:
          - errcheck
          - noctx

formatters:
  enable:
    - gofmt
